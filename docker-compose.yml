services:
  valkey:
    image: valkey/valkey-bundle:9-alpine
    container_name: valkey-commerce-cache
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: valkey-commerce-api
    environment:
      NODE_ENV: production
      PORT: 4000
      API_VERSION: v1
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: change-this-secret-before-deploying
      VALKEY_URL: redis://valkey:6379
      VALKEY_REQUIRED: "true"
    ports:
      - "4000:4000"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    container_name: valkey-commerce-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  valkey-data:
